<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도코데</title>
<meta name="theme-color" content="#F2F4F6">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous">
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--ink:#191F28;--ink2:#4E5968;--sub:#6B7684;--line:#E5E8EB;--fill:#F2F4F6;--fill2:#E5E8EB;--pri:#0F7A68;--pri-soft:#E6F4F1;--pri-text:#0B6656;--on-pri:#fff;--navbg:#FFFFFF;--dark:#191F28;--on-dark:#fff;--warn:#D9480F;--warn-soft:#FFF0E8;--now:#191F28;--now-line:#FFC83D;--food:#D6452F;--food-soft:#FDECE9;--radius:16px;--c:var(--pri);--rail-line:#D1D6DB;
  --pw:clamp(360px,26vw,460px);--navh:60px;--shadow:0 2px 10px rgba(0,0,0,.10);--sheet-shadow:0 -4px 16px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--card:#1B1E22;--ink:#ECEEF0;--ink2:#C2C8CF;--sub:#9AA2AC;--line:#2A2E34;--fill:#24282D;--fill2:#2E3339;--pri:#3FC9A6;--pri-soft:#173A33;--pri-text:#5FD8B8;--on-pri:#08201A;--navbg:#1B1E22;--dark:#ECEEF0;--on-dark:#101214;--warn:#FF8A65;--warn-soft:#3A241C;--now:#000000;--now-line:#FFC83D;--food:#EF7A64;--food-soft:#3A2420;--rail-line:#3A3F46;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.01em;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- 배경 지도 ---------- */
#map{position:fixed;inset:0;z-index:0;background:#dfe6e6}
@media (prefers-color-scheme:dark){#map{background:#1b2224}.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
.leaflet-tile-pane{filter:saturate(.45) brightness(1.04) contrast(.92)}
.leaflet-tooltip.st{font-size:12px}
#map.low-zoom .leaflet-tooltip.st{display:none}
.leaflet-container{font:inherit}
.leaflet-div-icon{background:none;border:0}
.pin{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 11.5px/20px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.start{background:#fff;color:var(--c);border:3px solid var(--c);line-height:20px}
.pin.move{background:#fff;color:var(--c);border:2px dashed var(--c)}
.pin.cur{outline:4px solid rgba(231,197,90,.75)}
.pin.sel{transform:scale(1.25);box-shadow:0 0 0 3px rgba(78,151,141,.35),0 1px 4px rgba(0,0,0,.4)}
.fpin{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;border:2px solid #fff;background:var(--food);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.fpin.alt{background:#fff;border:2.5px solid var(--food)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.22),0 1px 4px rgba(0,0,0,.4)}
.leaflet-tooltip.lb{font-weight:600;font-size:12px;padding:1px 6px}
.leaflet-tooltip.st{background:transparent;border:0;box-shadow:none;padding:0;font-size:11px;color:#59625f;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.fd{color:var(--food);font-size:11px;padding:1px 5px}
.leaflet-tooltip.ward{background:transparent;border:0;box-shadow:none;padding:0;color:#7b8582;font-size:11px;letter-spacing:.08em}
.z-st .leaflet-tooltip.st,.z-fd .leaflet-tooltip.fd,.z-lb .leaflet-tooltip.lb,.z-wd .leaflet-tooltip.ward{display:none}
.leaflet-popup-content{margin:10px 14px;font-size:14px;line-height:1.45}
.leaflet-popup-content ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.popup a{color:var(--pri)}
.b-land{fill:#f4f3ee;stroke:#c9c6bc;stroke-width:.8px}.b-built{fill:#ebe6dc;stroke:none}.b-water{fill:#b9d1dc;stroke:none}
.b-river{stroke:#b9d1dc;fill:none;stroke-width:2px}.b-road2{stroke:#dcd6c8;fill:none;stroke-width:1.2px}.b-road1{stroke:#e2b874;fill:none;stroke-width:2px}.b-rail{stroke:#9aa0a6;fill:none;stroke-width:1px;stroke-dasharray:4 3}
#map.offline{background:#cfdfe6}

/* 지도 위 상단 바: 시계 + 날짜 */
#topbar{position:fixed;z-index:500;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#topbar > *{pointer-events:auto}
@font-face{font-family:"GN Kill Gothic";src:url(/fonts/gn-kill-gothic-ub-kana.woff2) format("woff2");font-weight:400 900;font-display:swap}
#brand{align-self:flex-start;font-family:"GN Kill Gothic",-apple-system,"Noto Sans KR",sans-serif;font-size:22px;line-height:1;color:var(--pri);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;box-shadow:var(--shadow);letter-spacing:.5px}
@media (max-width:700px){#brand{font-size:18px;padding:5px 10px}}
#clock{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:13px;color:var(--sub);box-shadow:var(--shadow)}
#clock b{color:var(--ink)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dchip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:700}
#mapbtns{position:fixed;z-index:500;right:10px;top:calc(100px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.mbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;padding:0}
.mbtn .i{width:22px;height:22px}
.mbtn.on{color:#1a73e8;border-color:#1a73e8}
#toast{position:fixed;z-index:900;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,24,23,.92);color:#fff;font-size:14px;padding:8px 14px;border-radius:8px;max-width:86vw;text-align:center;display:flex;align-items:center;gap:10px;justify-content:center}
#toast .tact{border:0;background:none;color:#8fe3c8;font-weight:700;font-size:14px;padding:6px 4px;margin:-6px -4px -6px 0;flex:none;white-space:nowrap}
#pickBar{position:fixed;z-index:950;left:12px;right:12px;top:calc(var(--tbh,100px) + 18px + env(safe-area-inset-top));background:#d6336c;color:#fff;border-radius:8px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
#pickBar button{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;min-height:36px}
#days2{display:none;padding:0 12px 6px;flex:none}
#days2 .dchip{box-shadow:none}

/* ---------- 도구창 ---------- */
#panel{position:fixed;z-index:600;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow)}
#grab{flex:none;padding:6px 16px 8px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#grab .bar{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
#peek{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peek b{color:var(--ink)}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--navbg)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:-.01em}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;font-weight:700}

/* 모바일: 아래 시트 + 하단 버튼 */
@media (max-width:639px), (max-width:899px) and (orientation:portrait), (max-width:899px) and (min-height:521px){
  nav{position:fixed;z-index:700;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--navh) + env(safe-area-inset-bottom))}
  nav button.on svg{stroke-width:2.4}
  #panel{left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));height:calc(100% - var(--navh) - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 54px);border-radius:16px 16px 0 0;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
  #panel.dragging{transition:none}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom.leaflet-left{bottom:calc(var(--sv,118px) + 4px);transition:bottom .28s}
  #toast{top:auto;bottom:calc(var(--sv,118px) + 12px);left:12px;right:68px;transform:none;max-width:none}
  body.sheetfull #toast{bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));right:12px}
  body.sheetfull #days2{display:flex}
  body.sheetfull #mapbtns{opacity:0;pointer-events:none}
  #topbar{transition:opacity .15s}
  body.sheetfull #topbar,body.sheetfull .leaflet-control-container{opacity:0;pointer-events:none}
  body.sheetfull #topbar > *{pointer-events:none}
  .leaflet-control-attribution{font-size:9px;opacity:.8}
  /* 모바일 글자 크기 */
  html,body{font-size:14px;line-height:1.6}
  #mapbtns{top:auto;bottom:calc(var(--sv,118px) + 12px);right:12px;transition:bottom .28s}
  #clock{font-size:12px;padding:3px 10px}
  .dchip{font-size:13px;padding:5px 11px}
  #peek{font-size:14px}
  #view{padding:2px 12px 16px}
  .card{padding:12px 14px;margin:10px 0;border-radius:16px}
  .k{font-size:12px}
  .big{font-size:15.5px;margin:4px 0 6px;line-height:1.45}
  .det,.muted{font-size:13px}
  .btn{font-size:15px;padding:10px 14px}
  .chip{font-size:14px;padding:6px 12px}
  .tag{font-size:13px}
  .dayhead h2{font-size:17px}
  .dayhead .sub,.legend{font-size:13px}
  .stop{grid-template-columns:40px 26px minmax(0,1fr);gap:9px;padding:12px 4px}
  .stop .time{font-size:13px}
  .num{width:26px;height:26px;font-size:12px}
  .what > b{font-size:14.5px;line-height:1.45}
  .what > small{font-size:12px;margin-top:2px}
  .todo li{font-size:13.5px;padding-left:24px;line-height:1.6;margin:3px 0}
  .todo li::before{width:14px;height:14px}
  .todo li.ride{padding-left:28px}
  .meal{margin-left:45px}
  .pick{font-size:14px}
  .msg{font-size:14px;line-height:1.6}
  .ja{font-size:18px}
  input[type=search],textarea,input[type=text],input[type=datetime-local]{font-size:16px;padding:8px 10px}
  .seg button{font-size:14px;padding:8px 0}
}
/* PC: 오른쪽에 붙은 반듯한 도구창 + 세로 아이콘 바 */
@media (min-width:900px), (orientation:landscape) and (max-height:520px) and (min-width:640px){
  :root{--rail:72px}
  nav{position:fixed;z-index:700;top:0;right:0;bottom:0;width:var(--rail);flex-direction:column;justify-content:flex-start;padding-top:8px}
  nav button{flex:none;height:72px;font-size:12px;gap:5px}
  nav button.on{background:var(--fill)}
  nav{border-left:1px solid var(--line)}
  #panel{top:0;bottom:0;right:var(--rail);width:var(--pw);border-left:1px solid var(--line);box-shadow:-2px 0 12px rgba(0,0,0,.08)}
  #grab{display:none}
  #view{padding:8px 18px 24px}
  #topbar{right:calc(var(--pw) + var(--rail) + 16px);left:16px;top:16px}
  #mapbtns{right:calc(var(--pw) + var(--rail) + 16px);top:auto;bottom:24px}
  .mbtn{width:40px;height:40px}
  #toast{left:calc(50% - (var(--pw) + var(--rail))/2)}
  .card{box-shadow:none}
  .dayhead{border-bottom:1px solid var(--line);padding-bottom:8px}
}

/* ---------- 도구창 내용 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.now{background:var(--now);border-color:var(--now-line)}
.k{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.big{font-size:18px;font-weight:700;margin:2px 0 6px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn{border:0;background:var(--pri);color:var(--on-pri);border-radius:8px;padding:9px 13px;font-weight:600;font-size:15px;min-height:40px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:var(--pri-soft);color:var(--pri-text)}
.btn:disabled{opacity:.5}
.det{font-size:14px;color:var(--sub);margin-top:4px}
.det b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:13px;background:var(--pri-soft);color:var(--pri-text);border-radius:8px;padding:6px 10px;margin:6px 6px 0 0;border:0;text-decoration:none;min-height:32px}
.ja{font-size:20px;font-weight:600}
ol{padding-left:20px;margin:8px 0}
ol li{margin:6px 0}
.tip{background:var(--pri-soft);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px}
.chk{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:12px}
.muted{color:var(--sub);font-size:14px}
.hide{display:none!important}
input[type=search],textarea,input[type=text],input[type=datetime-local]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{resize:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 0;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--pri);color:var(--on-pri);font-weight:700}
.empty{padding:14px 4px;line-height:1.6}
.setbox summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:28px}
.setbox summary::-webkit-details-marker{display:none}
.setbox summary::after{content:"펼치기";font-weight:400;color:var(--pri-text)}
.setbox[open] summary::after{content:"접기"}
.wait{color:var(--warn);font-weight:700}
.card .lmsg{color:var(--warn)}

/* 일정 (동선 지도와 같은 모양) */
.dayhead{margin:10px 0 6px}
.dayhead h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.dayhead h2 i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dayhead .sub{color:var(--sub);font-size:13px}
.stop{display:grid;grid-template-columns:44px 28px minmax(0,1fr);gap:8px;padding:10px 6px;border-radius:8px;cursor:pointer;align-items:start}
.stop.on{background:var(--card);box-shadow:inset 3px 0 0 var(--c)}
.stop.cur{background:var(--now);box-shadow:inset 3px 0 0 var(--now-line)}
.stop .time{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:3px}
.num{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.num.move{background:transparent;border:2px dashed var(--c);color:var(--c)}
.num.start{background:var(--card);color:var(--c);border:3px solid var(--c)}
.what{min-width:0}
.what > b{font-weight:600}
.what > small{display:block;color:var(--sub);font-size:13px}
.nowtag{display:inline-block;background:var(--now-line);color:#3b2f00;font-size:11px;font-weight:700;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:2px}
.todo{list-style:none;margin:6px 0 2px;padding:0;display:flex;flex-direction:column;gap:4px}
.todo li{position:relative;padding:4px 0 4px 26px;font-size:14px;line-height:1.45;cursor:pointer;border-radius:8px;min-height:32px}
.todo li::before{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border:1.5px solid var(--c);border-radius:4px;background:var(--card)}
.todo li.ride{font-weight:600;background:color-mix(in srgb,var(--c) 10%,transparent);padding:4px 8px 4px 30px}
.todo li.ride::before{left:8px;top:6px}
.todo li.done{color:var(--sub);text-decoration:line-through}
.todo li.done::before{background:var(--c);box-shadow:inset 0 0 0 2px var(--card)}
.stags .tag{font-size:12px;padding:2px 7px;margin-top:4px}
.meal{margin:2px 0 8px 52px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.meal{margin-left:0}}
.meal h3{margin:0 0 2px;font-size:13px;color:var(--food)}
.pick{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:baseline;cursor:pointer;border-radius:8px;padding:3px 4px;font-size:14px}
.pick.on{outline:2px solid #d6336c;outline-offset:-2px}
.pick .mk{color:var(--food)}
.pick small{color:var(--sub);font-size:12px}
.pick .pwalk{display:block;color:#d6336c;font-weight:600}
.pick .pwalk:empty{display:none}
.pick a{font-size:12px;color:var(--sub);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}


/* 일정 편집 */
.btn.sm{font-size:13px;padding:6px 10px;flex:none;white-space:nowrap}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.ebtn{float:right;margin:-4px 0 4px 8px;border:1px solid var(--line);background:var(--card);color:var(--pri-text);border-radius:8px;font-size:13px;font-weight:600;padding:6px 12px;min-height:34px}
.etag{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
/* ---------- 로그인 ---------- */
#login{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:24px;background:#3d8077;color:#fff}
#login[hidden]{display:none}
.lbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lbox img{border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.lname{font-family:"GN Kill Gothic",-apple-system,sans-serif;font-size:30px;color:#fff;letter-spacing:.5px}
.ltag{margin:0 0 10px;color:rgba(255,255,255,.92);font-size:14px;line-height:1.6;word-break:keep-all}
#gbtn{min-height:44px}
.gsi{display:flex;align-items:center;gap:12px;margin:0 auto;height:44px;padding:0 22px 0 14px;border:0;border-radius:16px;background:#fff;color:#1f1f1f;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.gsi svg{width:20px;height:20px}
.lmsg{min-height:1.4em;margin:0;color:#fff3c4;font-size:13px}
.lfine{margin:0;color:rgba(255,255,255,.75);font-size:12px}
/* ---------- 튜토리얼 ---------- */
.tut{position:fixed;inset:0;z-index:1500;background:rgba(15,20,19,.55);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.tut{place-items:center}}
.tutc{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:22px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:tutin .22s ease-out}
@keyframes tutin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico .i{width:22px;height:22px;vertical-align:middle;color:var(--pri)}
.tutc .ico .i{width:28px;height:28px}
.cv .i{width:20px;height:20px;color:var(--sub)}
.pin.draft .i{width:15px;height:15px;vertical-align:middle}
.k .i{color:var(--pri)}
body{font-variant-emoji:text}
#map .leaflet-tooltip.hid{visibility:hidden}
@media (prefers-color-scheme:dark){
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
  .leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
  .leaflet-container .leaflet-control-attribution{background:rgba(28,32,30,.8);color:var(--sub)}
  .leaflet-control-attribution a{color:var(--pri-text)}
  .leaflet-tooltip{background:var(--card);color:var(--ink);border-color:var(--line)}
  .leaflet-tooltip-right:before{border-right-color:var(--card)}.leaflet-tooltip-top:before{border-top-color:var(--card)}
  .leaflet-tooltip.st{color:#b8c2be;text-shadow:0 0 3px #000,0 0 3px #000}
  .leaflet-tooltip.st,.leaflet-tooltip.ward{background:transparent}
  .leaflet-popup-close-button{color:var(--sub)!important}
}
.tutc .ico{width:52px;height:52px;border-radius:16px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:26px;margin-bottom:12px}
.tutc h3{margin:0 0 6px;font-size:18px;word-break:keep-all}
.tutc p{margin:0;color:var(--sub);font-size:14px;line-height:1.65;word-break:keep-all}
.tutc .dots{margin-top:16px}
.tutf{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:nowrap}
.tutb{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri);width:18px;border-radius:4px}
.tutf .btn{min-width:72px;min-height:42px;padding:9px 16px;white-space:nowrap}
.tutskip{border:0;background:none;color:var(--sub);font-size:13px;padding:8px 4px;white-space:nowrap;flex:0 0 auto}
/* ---------- 새 여행 ---------- */
.newtrip label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.newtrip .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.newtrip .two > div{min-width:0}
.newtrip textarea{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.impdays{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.impday{font-size:13px;line-height:1.6;color:var(--sub)}
.impday b{color:var(--ink);margin-right:4px}
.impday span{display:inline-block;margin-right:8px}
.impday span.nf{text-decoration:underline dotted var(--warn)}
.tripitem{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;margin-top:6px;font:inherit}
.tripitem span{font-size:12px;color:var(--sub)}
.tripitem.on{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
@media (max-width:400px){.newtrip .two{grid-template-columns:1fr;gap:0}}
.newtrip input[type=date]{width:100%;min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:16px}
.acct{display:flex;align-items:center;gap:10px}
.acct img{width:32px;height:32px;border-radius:50%}
.stop.gone{opacity:.55;cursor:default}
.stop .what{position:relative;padding-right:34px}
.stop .chev{position:absolute;right:0;top:2px;font-size:12px;color:var(--sub);background:var(--pri-soft);border-radius:16px;padding:1px 8px;line-height:1.6;transition:transform .2s}
.stop.open .chev{color:var(--pri)}
.stop:not(.open) .sdet{display:none}
.stop .sdet{grid-column:2 / -1;min-width:0}
.stop .sdet .memo{display:block;color:var(--sub);font-size:13px;margin-bottom:2px}
.stop:not(.open) + .smeal{display:none}
.stop .sdet{animation:sdet .18s ease-out}
@keyframes sdet{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.stop:not(.open){padding-top:12px;padding-bottom:12px}
.dayhead h2{word-break:keep-all}
.stop.gone b{text-decoration:line-through}
.addstop{display:block;width:100%;margin:8px 0;padding:10px;border:1.5px dashed var(--line);border-radius:8px;background:none;color:var(--pri);font-weight:600;font-size:14px}
.edit{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.edit label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-top:8px}
.edit label input,.edit label textarea{display:block;margin-top:3px;font-weight:400;color:var(--ink)}
.edit input[type=time]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 8px;font-size:16px;width:100%}
.erow{display:flex;gap:8px;align-items:flex-end}
.erow .et{flex:none;width:136px}
@media (max-width:360px){.erow .et{width:108px}.edit input[type=time]{padding:9px 4px}}
.pres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pr{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px}
.pr small{display:block;color:var(--sub);font-size:12px}
#map.picking,#map.picking .leaflet-interactive{cursor:crosshair}
.pin.draft{background:#d6336c;line-height:22px}
/* AI 묻기 */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.msg.u{align-self:flex-end;background:var(--pri);color:var(--on-pri);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg img{max-width:160px;border-radius:8px;display:block;margin-bottom:6px}
.msg > div{white-space:normal}
.msg [data-askabout]{display:none}
.typing{color:var(--sub);font-size:14px}
#composer{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:8px 10px}
#composer .in{display:flex;gap:6px;align-items:flex-end}
#composer textarea{flex:1;min-height:42px;max-height:120px}
.ico{border:1px solid var(--line);background:var(--card);border-radius:8px;width:42px;height:42px;font-size:20px;flex:none;padding:0}

/* 보여주기 · 긴급 */
.show{position:fixed;inset:0;z-index:2000;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.show .ja{font-size:34px;line-height:1.45}
.show .ko{color:#666;margin-top:16px}
.show .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;border:0;background:#eee;color:#111;border-radius:16px;padding:10px 16px;font-size:15px;min-height:44px}
.sosbar{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn)}
a.tel{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit}
a.tel .n{font-size:16px;white-space:nowrap;flex:none;margin-left:10px;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
.paysum .big{font-size:26px;font-weight:800;margin:2px 0 2px}
.payrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.payrow:last-of-type{border-bottom:0}
.paypp{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.payadd input[type=text]{margin-top:8px}
.payamt{display:flex;gap:8px;align-items:center}
.payamt input[type=text]{flex:1;min-width:0;width:auto}
.payamt .seg{flex:none;margin:8px 0 0;width:104px}
.payadd .k{margin-top:6px}
.paymsg{min-height:1.3em;margin:2px 0;color:var(--warn);font-size:13px}
.payitem{display:flex;align-items:center;gap:8px;margin:6px 0;padding:10px 12px}
.payitem .pn{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;border:0;background:none;padding:0;font:inherit;color:inherit}
button.pn{cursor:pointer}
.payitem.on{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.paypp span,.payrow span{overflow-wrap:anywhere}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#payD{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;font-size:16px}
.payitem .amt{text-align:right;font-weight:700;white-space:nowrap}
.payitem .amt .muted{font-weight:400;font-size:12px}
.x{border:0;background:none;color:var(--sub);font-size:18px;line-height:1;padding:8px;min-width:36px;min-height:36px;cursor:pointer}
.chip .x{min-width:28px;min-height:28px;padding:4px}
.linkname{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.linkname .i{width:12px;height:12px;opacity:.55;vertical-align:-1px}
.chip .x{font-size:15px;padding:0 0 0 2px}
.linkbtn{border:0;background:none;color:var(--pri-text);text-decoration:underline;padding:0;font:inherit;cursor:pointer}
.prepchip{font-weight:700}
.prepbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.prepbar i{display:block;height:100%;background:var(--pri)}
.preplist{padding:4px 12px}
.prep{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prep:last-child{border-bottom:0}
.prep .pt{flex:1;min-width:0;line-height:1.4}
button.pt{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pedit input[type=text],.pedit select{width:100%;margin-bottom:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-size:16px;color:inherit}
.x.pe .i{width:15px;height:15px}
.prep.done .pt span{text-decoration:line-through;color:var(--sub)}
.pchk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--pri);background:var(--card);color:var(--on-pri);display:flex;align-items:center;justify-content:center;padding:0;margin-top:1px}
.prep.done .pchk{background:var(--pri)}
.pchk .i{width:16px;height:16px;stroke-width:3}
.pchk:disabled{opacity:.6;cursor:default}
button.pt[aria-disabled=true]{cursor:default}

/* ================= 디자인 v2: 연회색 바탕 + 역 표지판의 색과 번호 ================= */
body{font-size:16px;font-weight:500;font-feature-settings:"tnum" 0}
.tnum,.stop .time,.btime,#clock,.amt,.paysum .big,.payrow b{font-variant-numeric:tabular-nums}
/* 상단: 로고·시계 한 줄 + 날짜 한 줄 */
.tbrow{display:flex;align-items:center;gap:8px;pointer-events:auto;align-self:flex-start;max-width:100%}
#brand{border:0;border-radius:999px;box-shadow:var(--shadow);font-size:18px;padding:7px 14px;color:var(--pri)}
#clock{align-self:center;border:0;box-shadow:var(--shadow);padding:6px 12px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip{border:0;background:var(--card);color:var(--ink2);font-weight:600;font-size:14px;padding:7px 14px;box-shadow:var(--shadow)}
.dchip.on{background:var(--pri);color:var(--on-pri)}
#days2 .dchip{background:var(--card);box-shadow:none}
#cq,#view > input[type=search]{background:var(--card)}
#days2 .dchip.on{background:var(--pri);color:var(--on-pri)}
.prepchip{font-weight:700}
.mbtn{border:0;border-radius:999px;box-shadow:var(--shadow);color:var(--ink)}
.mbtn.on{color:var(--pri);border:0}
/* 시트·탭 */
#panel{background:var(--bg);box-shadow:var(--sheet-shadow)}
#grab .bar{background:var(--fill2)}
#peek{color:var(--sub);font-size:14px}
#peek b{color:var(--ink);font-weight:700}
nav{background:var(--navbg);border-top:1px solid var(--line)}
nav button{color:var(--sub);font-weight:500}
nav button.on{color:var(--ink);font-weight:700}
nav button.on svg{stroke:var(--pri)}
/* 카드·버튼: 테두리 없는 흰 카드, 색은 주 버튼 하나에만 */
.card{border:0;border-radius:16px;box-shadow:none;padding:16px 18px;margin:12px 0}
.k{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:0}
.k .i{color:var(--ink2)}
.big{font-size:20px;font-weight:700;line-height:1.4;color:var(--ink)}
.muted,.det{color:var(--sub);font-size:13px;font-weight:400}
.btn{border-radius:8px;font-size:15px;font-weight:700;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.btn.ghost{background:var(--fill);color:var(--ink);border-radius:999px}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.tag{background:var(--fill);color:var(--ink2);border-radius:999px;padding:6px 12px;font-weight:600}
.chip{border:0;background:var(--card);color:var(--ink2);font-weight:600;border-radius:999px}
.payadd .chip,.pedit .chip,.edit .chip{background:var(--fill)}
.edit .chip.on{background:var(--dark);color:var(--on-dark)}
.gochips{padding:6px 0 4px}
.chip.on{background:var(--pri);color:var(--on-pri)}
#cchips .chip.on{background:var(--dark);color:var(--on-dark)}
.seg{background:var(--fill);border:0;border-radius:999px;padding:4px}
.seg button{border-radius:999px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--dark);color:var(--on-dark)}
input[type=search],textarea,input[type=text],input[type=datetime-local],input[type=date],select,.edit input[type=time]{border:0;background:var(--fill);border-radius:8px;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
.linkbtn{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.addstop{border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font-size:15px}
.addstop .i{color:var(--pri)}
.ebtn{border:0;background:var(--fill);color:var(--ink);border-radius:999px}
.etag{border:0;background:var(--fill);color:var(--sub);border-radius:4px}
.setbox summary::after{color:var(--sub)}
.dayhead{margin:18px 2px 8px;border:0!important;padding:0!important}
.dayhead h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.dayhead .sub{font-size:13px;color:var(--sub)}
.legend{color:var(--sub)}
.dia{display:inline-block;width:8px;height:8px;background:var(--food);transform:rotate(45deg);border-radius:1px;margin-right:2px}
.dia.o{background:none;border:1.5px solid var(--food)}
.pick .mk .i{width:14px;height:14px;color:var(--food);fill:var(--food)}
.pick a .i{width:12px;height:12px}
.meal{border:0;border-radius:16px;margin-left:96px}
.tripitem{border:0;background:var(--fill);border-radius:8px}
.tripitem.on{background:var(--pri-soft);box-shadow:inset 3px 0 0 var(--pri)}
.payitem{border-radius:16px}
.msg.a{border:0}
.ico{border:0;background:var(--fill);border-radius:999px}
#composer{background:var(--card);border-top:0}
/* 역번호 배지: 노선색 테두리 + 위 글자, 아래 숫자 */
.sta{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:-5px;min-width:22px;height:24px;padding:0 2px;margin:0 3px;border:2px solid var(--sc);border-radius:4px;background:#fff;color:#191F28;line-height:1;font-style:normal}
.sta b{font-size:8.5px;font-weight:800;letter-spacing:0}
.sta i{font-style:normal;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
/* 지금 카드 = 발차판 */
.board{border-radius:16px;overflow:hidden;margin:12px 0;background:var(--card)}
.bhead{background:var(--now);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.bk{font-size:12px;font-weight:700;color:#191F28;background:var(--now-line);border-radius:4px;padding:2px 6px}
.btime{font-size:32px;font-weight:800;color:var(--now-line);font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.bline{margin-left:auto;font-size:13px;font-weight:700;color:#fff;padding:3px 10px 3px 12px;border-left:6px solid var(--lc);background:rgba(255,255,255,.08);border-radius:4px}
.bdest{background:var(--now);color:#fff;font-size:20px;font-weight:700;padding:2px 16px 14px;line-height:1.35}
.bdest .sta{background:#fff}
.bbody{padding:12px 16px 16px}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:5px 0;font-size:15px;color:var(--ink);line-height:1.45}
.brow .bl{font-size:13px;color:var(--sub);font-weight:600;padding-top:1px}
.brow.sub{color:var(--ink2);font-size:14px}
/* 일정 = 노선도: 왼쪽 세로선 하나, 구간 색은 그 노선 색 */
.route{position:relative;background:var(--card);border-radius:16px;padding:6px 14px 6px 0}
.stop{grid-template-columns:52px 28px minmax(0,1fr);gap:10px;padding:12px 0;border-radius:0;position:relative;background:none!important;box-shadow:none!important}
.stop::before,.stop::after{content:"";position:absolute;left:75px;width:4px;z-index:0}
.stop::before{top:0;height:26px;background:var(--li,transparent)}
.stop::after{top:26px;bottom:0;background:var(--lo,transparent)}
.stop .time{text-align:right;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink2);padding-top:4px}
.stop .num{position:relative;z-index:1;width:28px;height:28px;font-size:13px;font-weight:800;background:var(--card);color:var(--ink);border:3px solid var(--ink)}
.stop .num.start{border-width:3px}
.stop.on .num{background:var(--ink);color:var(--card)}
.stop.cur .num{width:34px;height:34px;margin:-3px;background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 4px var(--pri-soft)}
.stop.cur .what > b{color:var(--pri-text)}
.what > b{font-size:16px;font-weight:700;color:var(--ink)}
.nowtag{background:var(--pri);color:#fff;border-radius:999px;padding:1px 8px}
.stop .chev{background:none;color:var(--sub);padding:0 2px}
.leg{position:relative;min-height:34px;padding:6px 0 6px 100px;display:flex;align-items:center}
.leg::before{content:"";position:absolute;left:75px;top:0;bottom:0;width:4px;background:var(--lc)}
.leg.bare{min-height:10px;padding:0}
.leg span{font-size:13px;color:var(--ink2);font-weight:600}
.leg span:empty{display:none}
.stop .sdet{grid-column:3 / -1}
.todo li::before{border-radius:4px;border-color:var(--sub)}
.todo li.done::before{background:var(--pri);border-color:var(--pri)}
.todo li.ride{background:var(--fill);border-radius:8px}
.stags .tag{padding:4px 10px}
.smeal{padding-left:0}
/* AI 묻기 캐릭터 */
.mascot{width:72px;height:72px;display:block;margin:4px 0 8px}
.hint{background:transparent;padding:4px 2px;margin:6px 0}
@media (prefers-color-scheme:dark){
  .sta{background:#fff}
  .bhead,.bdest{background:#000}
  .stop.cur .num{color:#08201A}
}
@media (max-width:420px){.meal{margin-left:0}}
.mlist{display:flex;flex-direction:column;margin-top:4px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
</style>
</head>
<body>
<div id="map" aria-label="동선 지도"></div>
<div id="topbar"><div class="tbrow"><div id="brand">DokoDae</div><div id="clock"></div></div><div class="days" id="days"></div></div>
<div id="mapbtns">
  <button class="mbtn" id="locBtn" aria-label="내 위치" title="내 위치"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
  <button class="mbtn" id="fitBtn" aria-label="이날 동선 전체 보기" title="이날 동선 전체 보기"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button class="mbtn" id="layerBtn" aria-label="지도 종류 바꾸기" title="지도 종류 바꾸기"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8.5 4.5L12 13 3.5 8.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg></button>
</div>
<aside id="panel" aria-label="도구창">
  <div id="grab"><div class="bar"></div><div id="peek"></div></div>
  <div class="days" id="days2" aria-label="날짜 고르기"></div>
  <div id="view"></div>
  <div id="composer" class="hide"><div class="in">
    <button class="ico" id="photoBtn" aria-label="사진으로 묻기"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3.2l1.5-2.5h6.6L16.8 8H20v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input type="file" id="photo" accept="image/*" capture="environment" class="hide">
    <textarea id="q" rows="1" placeholder="막힌 상황을 적어 주세요"></textarea>
    <button class="btn" id="send">보내기</button>
  </div></div>
</aside>
<nav id="nav">
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3"/></svg><span>일정</span></button>
  <button data-tab="ask"><svg viewBox="0 0 24 24"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-7l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg><span>AI 묻기</span></button>
  <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="13" height="17" rx="2"/><path d="M7.5 8h6M7.5 11.5h6M7.5 15h4M20 7v12.5a1.5 1.5 0 0 1-1.5 1.5"/></svg><span>상황카드</span></button>
  <button data-tab="pay"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.8 7.8 12 12l3.2-4.2M12 12v5M9.3 12.6h5.4M9.3 15h5.4"/></svg><span>경비</span></button>
  <button data-tab="sos"><svg viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z"/><path d="M12 10v4.5M12 17.2h.01"/></svg><span>긴급</span></button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<div id="login" hidden>
  <div class="lbox">
    <img src="/icon-512.png" alt="" width="88" height="88">
    <div class="lname">DokoDae</div>
    <p class="ltag">일본 여행 현장에서 일정, 길 찾기, 막힐 때 도움까지 한곳에서.</p>
    <div id="gbtn"></div>
    <p id="loginMsg" class="lmsg"></p>
    <p class="lfine">로그인하면 내 일정이 내 계정에 따로 저장돼요.</p>
  </div>
</div>
<script src="/boot.js"></script>
</body>
</html>
